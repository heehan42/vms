<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebRTC 동영상 재생</title>
</head>
<body>
    <h1>WebRTC 동영상 재생</h1>
    <!-- app.js가 실행되면 이 문구를 바꾼다. 문구가 그대로면 스크립트 전달에 실패한 것이다. -->
    <p id="script-status">app.js를 불러오지 못했습니다.</p>

    <h2>연결 확인</h2>
    <!-- app.js가 GET /api/sources로 받은 목록으로 option 요소를 채운다. 연결 버튼을 누르면 고른 소스로
         새 연결을 맺는다. 목록 요청이 끝나기 전에 소스 없이 연결되지 않도록 버튼은 비활성 상태로 시작한다. -->
    <label for="source-select">소스</label>
    <select id="source-select" disabled>
        <option value="">목록을 불러오는 중</option>
    </select>
    <button id="connect-button" type="button" disabled>연결</button>
    <!-- ICE 상태가 connected가 된 뒤 DTLS 핸드셰이크가 끝나면 연결 상태가 connected가 된다.
         DTLS 상태와 SRTP 암호는 연결 상태가 connected가 되었을 때 transport 통계에서 읽는다. -->
    <dl>
        <dt>시그널링</dt>
        <dd id="signaling-status">시작 전</dd>
        <dt>ICE 상태 (iceConnectionState)</dt>
        <dd id="ice-state">-</dd>
        <dt>연결 상태 (connectionState)</dt>
        <dd id="connection-state">-</dd>
        <dt>DTLS 상태 (dtlsState)</dt>
        <dd id="dtls-state">-</dd>
        <dt>SRTP 암호 (srtpCipher)</dt>
        <dd id="srtp-cipher">-</dd>
    </dl>
    <!-- "녹화" 소스를 고르면 WebRTC 대신 hls.js로 재생 목록을 재생한다. 위의 WebRTC 항목은 "-"로 비우고,
         재생 상태와 복구할 수 없는 오류, 지금 보이는 화면의 녹화 시각(브라우저 지역 시각)을 아래에 표시한다. -->
    <dl>
        <dt>녹화 재생</dt>
        <dd id="recording-status">-</dd>
        <dt>녹화 시각</dt>
        <dd id="recording-time">-</dd>
    </dl>

    <h2>영상</h2>
    <!-- Chrome 자동 재생 정책상 음소거여야 사용자 동작 없이 재생된다. 오디오가 없어도 muted가 필요하다.
         재생 막대(controls)는 녹화를 재생하는 동안에만 app.js가 켠다. -->
    <video id="remote-video" autoplay muted playsinline></video>
    <!-- 녹화 재생에 쓰는 hls.js. 외부 네트워크 없이 재생할 수 있도록 서버가 웹 루트에서 직접 제공한다. -->
    <script src="vendor/hls.js-1.7.4/hls.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
